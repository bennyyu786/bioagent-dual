services:
  orchestrator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    volumes:
      - ./state:/state:rw
      - ./config:/app/config:ro
    environment:
      - PYTHONPATH=/app
    ports:
      - "127.0.0.1:8765:8765"
    command:
      - --bootstrap
      - config.runtime_factory:create_runtime
      - --observability-db
      - /state/operations.sqlite
      - --metrics-host
      - 0.0.0.0
      - --metrics-port
      - "8765"
      - --allow-container-bind
      - --reconcile-startup
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
