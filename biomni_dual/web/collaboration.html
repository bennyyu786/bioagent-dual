</div><div id="toast" role="status"></div>
<script>
(() => {'use strict';let acceptanceQueue=null,acceptancePolicy=null;const dagResultCache=new Map(),dagResultPending=new Set(),dagResultMode=new Map();let token=null,uid='',ws='',page='home',data={},socket=null,lastEvent=0,refreshTimer=null,graphData=null,selectedTask=null,taskTrace=null,graphSearch='',graphFilter='all',graphZoom=1,topologyData=null,topologyFocus=null,topologySearch='',topologyZoom=1,chatSession='main';
const el=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=msg=>{el('toast').textContent=msg;el('toast').style.display='block';setTimeout(()=>el('toast').style.display='none',4200)};
async function api(path,body,method='GET'){const opts={method,headers:{Authorization:'Bearer '+token}};if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}const r=await fetch(path,opts);let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}
const root=()=>'/api/v2/'+encodeURIComponent(ws);
async function login(e){e.preventDefault();try{const d=await apiPublic('/api/v2/login',{email:el('email').value,password:el('password').value});token=d.token;uid=d.user_id;el('password').value='';await start()}catch(err){toast(err.message)}}
async function apiPublic(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.detail||'Login failed');return d}
async function start(){dagResultCache.clear();dagResultPending.clear();dagResultMode.clear();const m=await api('/api/v2/me');el('email-label').textContent=m.email;el('workspace').innerHTML=m.workspaces.map(w=>`<option value="${escape(w.id)}">${escape(w.title)} · ${escape(w.role)}</option>`).join('');if(!m.workspaces.length)throw Error('No workspaces');ws=m.workspaces[0].id;workspaceProjects=m.workspaces;renderSidebarProjects();el('login').classList.add('hidden');el('shell').classList.remove('hidden');await reload();await refreshHistory(true);try{const latest=await api(root()+'/events/history?limit=1');if(latest.events?.length)lastEvent=latest.events[0].id}catch{}connect();refreshTimer=setInterval(reload,10000)}
async function reload(){try{const currentWorkspace=ws;data=await api(root()+'/overview');if(page==='topology'){topologyData=await api(root()+'/topology');topologyData.runtime=await api(root()+'/runtime/resources');}if(page==='reviews'){const [q,p]=await Promise.all([api(root()+'/acceptance/queue'),api(root()+'/acceptance/policy')]);acceptanceQueue=q;acceptancePolicy=p;}if(page==='tasks'){graphData=await api(root()+'/graph');if(selectedTask && graphData.nodes.some(n=>n.id===selectedTask)){taskTrace=await api(root()+'/tasks/'+encodeURIComponent(selectedTask)+'/trace')}else{selectedTask=null;taskTrace=null}}if(ws===currentWorkspace){if((page==='reviews'&&el('review-decision-form')))return;if(page==='home'&&el('home-messages'))await loadUnifiedChat();else render()}}catch(e){toast(e.message)}}
function connect(){if(socket){socket.close();socket=null}el('socket-state').textContent='连接中';api(root()+'/tickets',{},'POST').then(d=>{const wsForSocket=ws;const scheme=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${scheme}//${location.host}/ws/${encodeURIComponent(ws)}?ticket=${encodeURIComponent(d.ticket)}&after=${lastEvent}`);const thisSocket=socket;socket.onopen=()=>{if(socket===thisSocket)el('socket-state').textContent='实时连接'};socket.onmessage=e=>{if(socket!==thisSocket)return;let evt=JSON.parse(e.data);lastEvent=Math.max(lastEvent,evt.id);onRealtimeEvent(evt)};socket.onclose=()=>{if(socket!==thisSocket)return;el('socket-state').textContent='轮询模式';if(token&&ws===wsForSocket)setTimeout(()=>{if(token&&ws===wsForSocket&&socket?.readyState!==WebSocket.OPEN)connect()},3000)};socket.onerror=()=>{if(socket===thisSocket)el('socket-state').textContent='连接异常'}}).catch(e=>toast(e.message))}
const fmt=(s)=>escape(s).replace(/\n/g,'<br>');function line(label,meta='',right=''){return `<div class="item"><div><div>${escape(label)}</div><small>${escape(meta)}</small></div><span class="tag">${escape(right)}</span></div>`}
function render(){document.body.classList.toggle('unified-home',page==='home');const d=data;el('title').textContent=({home:'Biomni AI',overview:'运行总览',tasks:'任务 DAG',topology:'双中心执行拓扑',chat:'Biomni AI',workers:'远程 Worker',reviews:'结果审核',logs:'实时日志',models:'模型连接',members:'成员与权限'})[page];const root=el('page');if(page==='home'){renderHome(root)}
else if(page==='overview'){root.innerHTML=`<section class="cards"><div class="card"><span>任务总数</span><b>${d.tasks?.length||0}</b></div><div class="card"><span>在线 Worker</span><b>${(d.workers||[]).filter(x=>x.state==='online').length}</b></div><div class="card"><span>事件数量</span><b>${d.recent_events?.length||0}</b></div><div class="card"><span>模型连接</span><b>${d.model?.configured?'就绪':'未配置'}</b></div></section><section class="layout"><div class="panel"><h3>任务</h3>${(d.tasks||[]).slice(0,15).map(t=>line(t.prompt,'ID '+t.id,t.status)).join('')||'<p class="muted">暂无任务</p>'}</div><div class="panel"><h3>事件流</h3>${(d.recent_events||[]).slice(-20).reverse().map(e=>line(e.kind,e.subject,'#'+e.id)).join('')||'<p class="muted">暂无事件</p>'}</div></section>`}
else if(page==='tasks'){renderGraph(root)}
else if(page==='topology'){renderTopology(root)}
else if(page==='workers'){root.innerHTML=`<div class="layout"><section class="panel"><h3>远程 Worker</h3>${(d.workers||[]).map(w=>`<div class="item"><div>${escape(w.id)} <span class="tag">${escape(w.state)}</span><div class="hint">心跳间隔 ${escape(w.age_seconds??'无')} 秒</div></div><div style="display:flex;gap:6px"><button data-w="${escape(w.id)}" data-a="drain">排空</button><button data-w="${escape(w.id)}" data-a="resume">恢复</button></div></div>`).join('')||'<p class="muted">暂无已注册 Worker</p>'}</section><section class="panel"><h3>注册 Worker（管理员）</h3><form id="worker-form" class="form"><input id="worker-id" placeholder="worker-id" required><button>生成 Worker 密钥</button></form><div id="worker-secret" class="notice">密钥只显示一次，请妥善保存。</div><p class="hint">控制命令由 Worker 主动领取和确认；中心不会在状态不明时自动重发。</p></section></div>`;el('worker-form').onsubmit=registerWorker;root.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>command(b.dataset.w,b.dataset.a))}
else if(page==='reviews'){renderReviews(root)}
else if(page==='logs'){renderLogs(root)}
else if(page==='models'){root.innerHTML=`<div class="layout"><section class="panel"><h3>模型提供商配置（管理员）</h3><p class="muted">连接到 OpenAI 兼容 API。密钥只在服务器环境变量中配置。</p><form id="model-form" class="form"><input id="model-url" placeholder="https://your-provider/v1" value="${escape(d.model?.base_url||'')}" required><input id="model-name" placeholder="model-id" value="${escape(d.model?.model||'')}" required><button>保存连接配置</button></form><button style="margin-top:12px" id="model-test">测试模型发现</button><div id="model-output" class="notice">尚未测试</div></section><section class="panel"><h3>连接状态</h3>${line(d.model?.model||'未配置模型',d.model?.base_url||'','MODEL')}<div class="notice">模型响应不会自动调用 Worker，工具和生产权限仅由控制平面授予。</div></section></div>`;el('model-form').onsubmit=saveModel;el('model-test').onclick=testModel}
else if(page==='members'){root.innerHTML=`<div class="layout"><section class="panel"><h3>成员</h3><div id="member-list">正在加载...</div></section><section class="panel"><h3>邀请团队成员（管理员）</h3><form id="member-form" class="form"><input id="member-email" placeholder="user@example.com" required><input id="member-password" type="password" placeholder="初始强密码（12 字符以上）" required><select id="member-role"><option value="viewer">viewer · 只读</option><option value="operator">operator · 操作</option><option value="admin">admin · 管理员</option></select><button>添加成员</button></form></section></div>`;el('member-form').onsubmit=invite;api(rootPath()+'/members').then(r=>el('member-list').innerHTML=r.map(m=>line(m.email,m.id,m.role)).join('')).catch(e=>el('member-list').textContent=e.message)} }


// Unified conversation frontend: no HTML from model output, and task results are
// rendered only when server-side task state is completed.
let homePending=false;

// Durable workspace history and event log are paginated; UI never deletes records.
let historySessions=[],historyTasks=[],historyNextSession=null,historyNextTask=null;
let historySelection={kind:'session',id:'main'};
let workspaceProjects=[];
function renderSidebarProjects(){
 const panel=el('sidebar-projects');if(!panel)return;
 panel.innerHTML=workspaceProjects.map(p=>`<button type="button" class="project-entry ${p.id===ws?'selected':''}" data-project-workspace="${escape(p.id)}" title="${escape(p.title)}">▱　${escape(p.title)}</button>`).join('')||'<span class="hint">暂无工作区</span>';
 panel.querySelectorAll('[data-project-workspace]').forEach(btn=>btn.onclick=()=>{
  if(btn.dataset.projectWorkspace===ws)return;
  el('workspace').value=btn.dataset.projectWorkspace;
  el('workspace').dispatchEvent(new Event('change'));
 });
}

let eventRows=[],eventNextBefore=null,logFilter='all',logBusy=false;
async function refreshHistory(reset=true){
 if(reset){historySessions=[];historyTasks=[]}
 const wsAtRequest=ws;
 const [sessions,tasksHistory]=await Promise.all([
  api(root()+'/assistant/history?kind=sessions&limit=80&offset='+(reset?0:historySessions.length)),
  api(root()+'/assistant/history?kind=tasks&limit=80&offset='+(reset?0:historyTasks.length))]);
 if(ws!==wsAtRequest)return;
 historySessions=historySessions.concat(sessions.items);historyTasks=historyTasks.concat(tasksHistory.items);
 historyNextSession=sessions.next_offset;historyNextTask=tasksHistory.next_offset;
 renderHistory();
}
function renderHistory(){
 const target=el('history-index');if(!target)return;
 target.innerHTML='<h3>最近 · 历史会话</h3>'+
  (historySessions.map(x=>`<button class="history-entry ${historySelection.kind==='session'&&chatSession===x.id?'selected':''}" data-session-id="${escape(x.id)}" title="${escape(x.preview)}">${escape(x.preview||'新对话')}<small>${escape(x.id)} · ${x.count} 条消息</small></button>`).join('')||'<p class="hint">暂无会话</p>')+
  (historyNextSession!==null?'<button class="history-more" id="more-sessions">加载更早的会话</button>':'')+
  '<h3>提交的任务</h3>'+
  (historyTasks.map(x=>`<button class="history-entry ${historySelection.kind==='task'&&historySelection.id===x.id?'selected':''}" data-history-task="${escape(x.id)}" title="${escape(x.title)}">${escape(x.title)}<small>${escape(x.status)} · ${escape(x.id.slice(0,12))}</small></button>`).join('')||'<p class="hint">暂无任务</p>')+
  (historyNextTask!==null?'<button class="history-more" id="more-tasks">加载更早的任务</button>':'');
 target.querySelectorAll('[data-session-id]').forEach(btn=>btn.onclick=()=>{chatSession=btn.dataset.sessionId;historySelection={kind:'session',id:chatSession};navigate('home');renderHistory()});
 target.querySelectorAll('[data-history-task]').forEach(btn=>btn.onclick=()=>{historySelection={kind:'task',id:btn.dataset.historyTask};navigate('home');if(el('home-mode'))el('home-mode').value='chat';renderHistory()});
 if(el('more-sessions'))el('more-sessions').onclick=async()=>{
  const r=await api(root()+'/assistant/history?kind=sessions&limit=80&offset='+historySessions.length);
  historySessions.push(...r.items);historyNextSession=r.next_offset;renderHistory();
 };
 if(el('more-tasks'))el('more-tasks').onclick=async()=>{
  const r=await api(root()+'/assistant/history?kind=tasks&limit=80&offset='+historyTasks.length);
  historyTasks.push(...r.items);historyNextTask=r.next_offset;renderHistory();
 };
}
function eventMatches(e){return logFilter==='all'||(logFilter==='worker'?e.kind==='worker_log':logFilter==='task'?/^(task_|dispatch_|planning_|runtime_)/.test(e.kind):e.kind!=='worker_log')}
async function loadEvents(reset=true){
 if(logBusy)return;logBusy=true;
 try{const wsAtRequest=ws;const url=root()+'/events/history?limit=100'+(!reset&&eventNextBefore?'&before='+eventNextBefore:'');
  const d=await api(url);if(wsAtRequest!==ws)return;
  eventRows=reset?d.events:eventRows.concat(d.events.filter(e=>!eventRows.some(x=>x.id===e.id)));
  eventRows.sort((a,b)=>b.id-a.id);eventNextBefore=d.next_before;renderEventRows();
 }catch(err){const status=el('log-status');if(status)status.textContent=err.message}finally{logBusy=false}
}
function renderLogs(target){
 target.innerHTML=`<section class="panel"><h3>WebSocket 实时事件与日志</h3>
  <p class="muted">展示工作区的任务、调度及 Worker 事件。历史事件保存在数据库中，断线后可重新加载。</p>
  <div class="log-controls"><select id="log-filter" aria-label="日志筛选"><option value="all">全部事件</option><option value="task">任务 / 调度</option><option value="worker">Worker 日志</option><option value="other">其他事件</option></select><button id="logs-refresh">刷新</button><span class="hint" id="log-status"></span></div>
  <div id="log-stream" class="logs" aria-live="polite"></div><button id="log-more" class="log-more">加载更早的记录</button></section>`;
 el('log-filter').value=logFilter;el('log-filter').onchange=e=>{logFilter=e.target.value;renderEventRows()};
 el('logs-refresh').onclick=()=>loadEvents(true);
 el('log-more').onclick=()=>loadEvents(false);
 renderEventRows();if(!eventRows.length)loadEvents(true);
}
function renderEventRows(){const box=el('log-stream');if(!box)return;
 const events=eventRows.filter(eventMatches);
 box.innerHTML=events.map(e=>`<div class="logrow"><time>${new Date(e.created*1000).toLocaleString()}</time><span class="event-kind">${escape(e.kind)} #${e.id}</span><pre>${escape(e.subject)}${e.payload?.text?' · '+escape(e.payload.text):''}${e.payload?.level?' ['+escape(e.payload.level)+']':''}</pre></div>`).join('')||'<div class="muted">当前筛选没有匹配事件，试试“全部事件”。</div>';
 if(el('log-more'))el('log-more').disabled=eventNextBefore===null;
 if(el('log-status'))el('log-status').textContent='共载入 '+eventRows.length+' 条事件';
}
function onRealtimeEvent(evt){
 if(!eventRows.some(e=>e.id===evt.id)){eventRows.unshift(evt);eventRows.sort((a,b)=>b.id-a.id)}
 if(page==='logs'){renderEventRows()}else reload();
 if(evt.kind==='chat_message'||evt.kind==='task_submitted')refreshHistory(true).catch(()=>{});

// Each task keeps its own follow-up conversation, separate from other tasks and sessions.
// The original task result is read-only; follow-up turns are append-only messages.
const taskFollowupSession=id=>'task-followup-'+id;
async function loadSelectedTask(){
 const target=el('home-messages');if(!target||historySelection.kind!=='task')return;
 const id=historySelection.id, workspace=ws;
 if(el('home-selection'))el('home-selection').textContent='历史任务 · '+id;
 if(el('home-input'))el('home-input').placeholder='针对当前任务结果继续追问或追加指令…';
 try{
  const [trace,followups]=await Promise.all([
   api(root()+'/tasks/'+encodeURIComponent(id)+'/trace'),
   api(root()+'/assistant/session/'+encodeURIComponent(taskFollowupSession(id)))
  ]);
  if(ws!==workspace||historySelection.kind!=='task'||historySelection.id!==id||!el('home-messages'))return;
  const task=trace.task||{},completed=task.status==='completed';
  let resultMarkup='<div class="task-meta">当前状态：'+escape(task.status||'未知')+'</div>';
  if(completed){
   try{
    const r=await api(root()+'/tasks/'+encodeURIComponent(id)+'/result');
    if(ws!==workspace||historySelection.kind!=='task'||historySelection.id!==id)return;
    resultMarkup+='<div class="task-meta">最终结果</div><div class="result-view">'+escape(r.presentation?.text??r.result??'已完成，但没有可显示的文本结果')+'</div>';
   }catch(err){resultMarkup+='<div class="task-meta">无法读取最终结果：'+escape(err.message)+'</div>'}
  }else{
   resultMarkup+='<div class="task-meta">当前任务尚未产生已完成的最终结果。</div>';
  }
  const messages=(followups.messages||[]).map(m=>{
   const mine=m.role==='user'&&m.author===uid;
   return '<div class="home-message '+(mine?'user':'assistant')+'"><div class="speaker">'+
    (mine?'你':m.role==='assistant'?'Biomni AI':'协作成员')+'</div>'+escape(m.body)+'</div>';
  }).join('');
  const html='<article class="home-task-focus"><h3>'+escape(task.title||id)+'</h3>'+
   '<div class="task-meta">Task ID：'+escape(id)+'</div>'+resultMarkup+
   '<div class="task-meta"><button type="button" data-task-dag="'+escape(id)+'">打开专业 DAG / 轨迹</button></div></article>'+
   '<div class="home-task-followups"><div class="task-meta">当前任务的追加对话</div>'+messages+'</div>';
  const nearBottom=target.scrollHeight-target.scrollTop-target.clientHeight<90;
  if(target.innerHTML!==html){target.innerHTML=html;if(nearBottom)target.scrollTop=target.scrollHeight}
  el('home-hero')?.classList.add('hidden');
  target.querySelector('[data-task-dag]')?.addEventListener('click',()=>{selectedTask=id;navigate('tasks')});
 }catch(err){if(ws===workspace&&historySelection.kind==='task'&&historySelection.id===id)
   target.textContent='加载任务历史失败：'+err.message}
}
async function updateModelStatus(){

  const state=await api(root()+'/models/status');

async function sendUnifiedTurn(e){
 e.preventDefault();if(homePending)return;
 const input=el('home-input'),message=input.value.trim(),mode=el('home-mode').value;
 if(!message)return;
 const destination=ws,selection={...historySelection},session=selection.kind==='task'?taskFollowupSession(selection.id):chatSession,request_id=crypto.randomUUID();
 homePending=true;el('home-send').disabled=true;el('home-status').textContent='正在处理…';
 try{
  const result=await api(root()+'/assistant/turn',{message,mode,session,request_id},'POST');
  if(destination!==ws||selection.kind!==historySelection.kind||selection.id!==historySelection.id)return;
  input.value='';
  el('home-status').textContent=result.route==='chat'?'已回复':`任务 ${result.task_route||'已创建'} · ${result.dispatch?.state||'等待执行'}`;
  await loadUnifiedChat();await refreshHistory(true);
 }catch(err){if(destination===ws&&selection.kind===historySelection.kind&&selection.id===historySelection.id){el('home-status').textContent=err.message;await updateModelStatus()}}
 finally{homePending=false;if(el('home-send'))el('home-send').disabled=false}
}

function graphPosition(nodes){const groups=new Map();for(const node of nodes){const a=groups.get(node.rank)||[];a.push(node);groups.set(node.rank,a)}const pos={};for(const [rank,group] of [...groups].sort((a,b)=>a[0]-b[0])){group.forEach((n,i)=>{pos[n.id]={x:24+rank*260,y:26+i*108}})}return pos}

ows||'<p class="muted">暂无派发记录</p>'}<h3 style="margin-top:18px">修复任务关系</h3>${repairRows||'<p class="muted">暂无经记录的修复关联</p>'}</section></div><details class="runtimecontrols"><summary>资源调度操作（管理员）</summary><div class="resourcepanels"><form id="quota-form" class="form"><h3>设置 Worker 配额</h3><input id="quota-worker" placeholder="Worker ID" required><input id="quota-cpu" type="number" min="0" max="1000000" placeholder="CPU (mCPU)" required><input id="quota-mem" type="number" min="0" max="10000000" placeholder="RAM (MiB)" required><input id="quota-gpu" type="number" min="0" max="256" placeholder="GPU 数量" required><button>保存配额</button></form><form id="reserve-form" class="form"><h3>预留任务资源（不自动执行）</h3><input id="reserve-task" placeholder="Task ID" required><input id="reserve-worker" placeholder="Worker ID" required><input id="reserve-cpu" type="number" min="0" max="1000000" placeholder="CPU (mCPU)" required><input id="reserve-mem" type="number" min="0" max="10000000" placeholder="RAM (MiB)" required><input id="reserve-gpu" type="number" min="0" max="256" placeholder="GPU 数量" required><button>提交资源预留</button></form><form id="skills-form" class="form"><h3>管理员登记 Worker 已批准适配器</h3><input id="skills-worker" placeholder="Worker ID" required><input id="skills-list" placeholder="能力 ID，英文逗号分隔" required><button>保存 Worker 能力</button></form><form id="dispatch-form" class="form"><h3>自动选择最高优先级就绪任务</h3><input id="dispatch-cpu" type="number" min="0" max="1000000" placeholder="CPU mCPU" required><input id="dispatch-mem" type="number" min="0" max="10000000" placeholder="RAM MiB" required><input id="dispatch-gpu" type="number" min="0" max="256" placeholder="GPU 数量" required><button>按配额与能力自动派发</button><p class="hint">需要在线 Worker。派发是待领取工单，实际执行需要受限 Worker 客户端。</p></form></div></details><p class="graphhint">资源数值为调度器预留配额，不是 CPU/GPU 的实时硬件利用率；reserved 为资源意图，claimed 是 Worker 已领取，uncertain 保持占用等待人工核对。worker reported_on 仅代表日志关联，并不证明正在执行。能力 lifecycle 属于人工登记的审核证据，不是在线健康探测。</p>${src.hidden_dependency_count?`<p function showResultView(container, view, raw, modeStore=null, modeKey=null){
 const human=String(view?.text??raw??''), source=String(raw??'');
 container.innerHTML='<div class="result-tabs"><button data-mode="readable" aria-pressed="true">阅读模式</button><button data-mode="raw" aria-pressed="false">原始证据</button><button data-mode="copy">复制当前内容</button></div><pre id="review-full-result" class="reviewresult result-view" data-result-text></pre><p class="hint">阅读模式仅用于呈现；原始证据与 SHA256 不会修改。</p>';
 const pre=container.querySelector('[data-result-text]');let mode=modeStore?.get(modeKey)||'readable';
 const draw=()=>{pre.textContent=mode==='readable'?human:source;container.querySelectorAll('[data-mode="readable"],[data-mode="raw"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===mode)))};
 container.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='copy'){navigator.clipboard?.writeText(pre.textContent).then(()=>toast('结果已复制')).catch(()=>toast('无法复制，请手动选择'))}else{mode=b.dataset.mode;if(modeStore)modeStore.set(modeKey,mode);draw()}});draw();
}
// DAG is the only completed-result UI. Keep the existing read-only, workspace-scoped API.
// A cache prevents periodic DAG refresh from losing the reader or re-requesting evidence.
async function loadDagResult(id,force=false){
 if(!id||page!=='tasks'||selectedTask!==id)return;
 const key=ws+':'+id, target=el('dag-result-detail');
 if(!target)return;
 if(force){dagResultCache.delete(key);dagResultMode.delete(key)}
 if(dagResultCache.has(key)){
  const r=dagResultCache.get(key);
  target.innerHTML='<div class="hint" id="dag-result-meta"></div><div id="dag-result-view"></div>';
  target.querySelector('#dag-result-meta').textContent=r.prompt+' · '+r.task_id;
  showResultView(target.querySelector('#dag-result-view'),r.presentation,r.result,dagResultMode,key);
  return;
 }
 if(dagResultPending.has(key))return;
 dagResultPending.add(key);
 target.textContent='正在加载最终结果…';
 try{
  const r=await api(root()+'/tasks/'+encodeURIComponent(id)+'/result');
  dagResultCache.set(key,r);
  if(page==='tasks'&&selectedTask===id&&ws+':'+id===key)loadDagResult(id);
 }catch(err){if(page==='tasks'&&selectedTask===id&&el('dag-result-detail'))el('dag-result-detail').textContent='加载结果失败：'+err.message}
 finally{dagResultPending.delete(key)}
}

 el('acceptance-policy-form').onsubmit=async ev=>{ev.preventDefault();try{await api(root()+'/acceptance/policy',{enabled:el('acceptance-enabled').checked,auto_l1:el('acceptance-l1').checked,auto_l2:el('acceptance-l2').checked,l1_capabilities:el('acceptance-l1-caps').value.split(',').map(s=>s.trim()).filter(Boolean)},'PUT');toast('验收策略已保存');await reload()}catch(err){toast(err.message)}};
 target.querySelectorAll('[data-auto-review]').forEach(btn=>btn.onclick=async()=>{try{const out=await api(root()+'/acceptance/'+encodeURIComponent(btn.dataset.autoReview)+'/evaluate',{},'POST');toast(out.status==='auto_verified'?'独立核验通过，任务已完成':(out.reason||'仍需人工审核'));await reload()}catch(err){toast(err.message)}});
 target.querySelectorAll('[data-inspect-review]').forEach(btn=>btn.onclick=async()=>{try{const id=btn.dataset.inspectReview,detail=el('review-detail');const x=await api(root()+'/dispatch/'+encodeURIComponent(id)+'/evidence');const tier=items.find(j=>j.id===id)?.tier||'L2';detail.innerHTML=`<h3>审核结果 · ${escape(tier)}</h3><div class="hint">任务：${escape(x.task_id)}　Worker：${escape(x.worker)}　声明：${escape(x.worker_state)}</div><p class="hint">结果 SHA256: <code>${escape(x.sha256)}</code></p><h4>执行结果（阅读模式 / 原始证据）</h4><div id="review-result-view"></div><form id="review-decision-form" class="form"><label>审核依据或独立验证引用（至少 8 字符）<textarea id="review-evidence" rows="3" minlength="8" maxlength="256" required placeholder="填写检查记录或外部验证报告 ID。L2/L3 还要求服务端独立验证器通过。"></textarea></label><label><input id="review-confirm" type="checkbox" required> 我已核对完整结果，并理解验收等级及证据要求</label><div class="reviewactions"><button type="submit" class="primary" id="review-accept">审核通过</button><button type="button" class="danger" id="review-reject">审核拒绝</button></div></form>`;showResultView(el('review-result-view'),x.presentation,x.result);
 const send=async accepted=>{const note=el('review-evidence').value.trim();if(note.length<8||!el('review-confirm').checked){toast('请先填写审核依据并确认已核对原文');return}if(!confirm(accepted?'确认验收通过并完成任务？':'确认拒绝结果并结束本次执行？'))return;try{const out=await api(root()+'/dispatch/'+encodeURIComponent(id)+'/review',{accepted,evidence_ref:note,expected_sha256:x.sha256},'POST');toast('审核结果：'+out.state);await reload()}catch(err){toast(err.message)}};
 el('review-decision-form').onsubmit=e=>{e.preventDefault();send(true)};el('review-reject').onclick=()=>send(false);detail.scrollIntoView({block:'nearest',behavior:'smooth'});
 }catch(err){toast(err.message)}});
}

function navigate(destination){page=destination==='chat'?'home':destination;el('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='tasks'||page==='topology'||page==='reviews')reload();else render()}
const rootPath=()=>root();async function submitTask(e){e.preventDefault();if(!confirm('确认将此内容提交至 TaskCenter？'))return;try{const result=await api(root()+'/tasks',{prompt:el('task-text').value,request_id:crypto.randomUUID()},'POST');selectedTask=result.id;toast('任务已提交：'+(result.planning?.status||result.dispatch?.state||'pending')+(result.dispatch?.reason?' · '+result.dispatch.reason:''));if(el('last-submit-result')){el('last-submit-result').classList.remove('hidden');el('last-submit-result').textContent=result.planning?'规划状态：'+result.planning.status+'；步骤数：'+(result.planning.count||0)+'；派发工单：'+(result.dispatch?.offers||[]).filter(o=>o.state==='offered').length+'。'+(result.planning.message||''):'派发状态：'+result.dispatch?.state+'。'+(result.dispatch?.reason||'')}await reload()}catch(e){toast(e.message)}}
async function submitMessageAsTask(messageId,messages){
const msg=messages.find(m=>m.id===messageId&&m.author===uid&&m.role==='user');
if(!msg||!confirm('将这条消息原样提交到任务中心？'))return;
try{const created=await api(root()+'/tasks',{prompt:msg.body,source_message_id:messageId,request_id:crypto.randomUUID()},'POST');selectedTask=created.id;toast('已从对话创建任务');navigate('tasks')}catch(err){toast(err.message)}
}
async function sendChat(e){e.preventDefault();try{await api(root()+'/chat',{session:chatSession,body:el('chat-text').value},'POST');el('chat-text').value='';await loadChat()}catch(e){toast(e.message)}}
async function loadChat(){try{const d=await api(root()+'/chat/'+encodeURIComponent(chatSession));const target=el('chat-list');if(target){target.innerHTML=d.messages.map(m=>`<div class="bubble ${m.author===uid?'mine':''}"><div class="who">${escape(m.author.slice(0,8))} · ${escape(m.role)}</div>${fmt(m.body)}${m.author===uid&&m.role==='user'?`<div class="related"><button data-message-task="${escape(m.id)}">转为任务</button></div>`:''}</div>`).join('');target.scrollTop=target.scrollHeight;target.querySelectorAll('[data-message-task]').forEach(b=>b.onclick=()=>submitMessageAsTask(b.dataset.messageTask,d.messages))}}catch(e){toast(e.message)}}
async function askModel(e){e.preventDefault();el('ai-reply').textContent='模型请求中...';try{let d=await api(root()+'/models/chat',{session:chatSession,message:el('ai-text').value},'POST');el('ai-reply').textContent=d.answer;await loadChat()}catch(e){el('ai-reply').textContent=e.message}}
async function registerWorker(e){e.preventDefault();try{const d=await api(root()+'/workers',{id:el('worker-id').value},'POST');el('worker-secret').textContent='一次性密钥：'+d.secret;await reload()}catch(e){toast(e.message)}}
async function command(w,a){if(!confirm('确认向 '+w+' 下发 '+a+' 命令？'))return;try{await api(root()+'/workers/'+encodeURIComponent(w)+'/commands',{action:a,payload:{}},'POST');toast('命令已排队，等待 Worker 领取')}catch(e){toast(e.message)}}
async function saveModel(e){e.preventDefault();try{await api(root()+'/models/config',{base_url:el('model-url').value,model:el('model-name').value},'POST');toast('配置已保存');await reload()}catch(e){toast(e.message)}}
async function testModel(){el('model-output').textContent='正在连接...';try{let d=await api(root()+'/models/probe',{},'POST');el('model-output').textContent=d.connected?'连接成功，发现 '+d.models_found+' 个模型':('连接失败：'+(d.error?.type||'unknown')+(d.error?.http_status?' (HTTP '+d.error.http_status+')':'')+'；'+(d.error?.message||'请检查服务器日志'))}catch(e){el('model-output').textContent=e.message}}
async function invite(e){e.preventDefault();try{await api(root()+'/members',{email:el('member-email').value,password:el('member-password').value,role:el('member-role').value},'POST');toast('成员已添加');await reload()}catch(e){toast(e.message)}}
function appendLog(ev){const t=el('log-stream');if(!t)return;const line=document.createElement('div');line.textContent=`[${new Date(ev.created*1000).toLocaleTimeString()}] ${ev.subject} [${ev.payload?.level}] ${ev.payload?.text}`;t.appendChild(line);if(t.childNodes.length>250)t.removeChild(t.firstChild);t.scrollTop=t.scrollHeight}
el('sidebar-new-chat').onclick=()=>{chatSession='chat-'+crypto.randomUUID();historySelection={kind:'session',id:chatSession};navigate('home');refreshHistory(true).catch(()=>{})};
el('login-form').onsubmit=login;el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));el('workspace').onchange=async()=>{ws=el('workspace').value;renderSidebarProjects();chatSession='main';historySelection={kind:'session',id:'main'};lastEvent=0;selectedTask=null;taskTrace=null;graphData=null;dagResultCache.clear();dagResultPending.clear();dagResultMode.clear();topologyData=null;topologyFocus=null;historySessions=[];historyTasks=[];eventRows=[];eventNextBefore=null;await reload();await refreshHistory(true);connect()};el('logout').onclick=async()=>{try{await api('/api/v2/logout',{},'POST')}catch{}token=null;historySelection={kind:'session',id:'main'};selectedTask=null;taskTrace=null;dagResultCache.clear();dagResultPending.clear();dagResultMode.clear();if(socket)socket.close();clearInterval(refreshTimer);el('shell').classList.add('hidden');el('login').classList.remove('hidden')};
})();
</script></body></html>
